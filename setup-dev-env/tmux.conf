# Managed by the /setup-dev-env skill. Machine-specific lines go at the bottom.

# Mouse: click to focus panes and tabs, drag borders to resize, scroll history
set -g mouse on
set -g history-limit 50000
# True color + fast escape so Claude Code's TUI renders and responds cleanly
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -sg escape-time 10
set -g focus-events on

# --- Tabs (windows) and panes numbered from 1 ---
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# --- Alt shortcuts (no prefix needed) ---
bind -n M-d split-window -h -c "#{pane_current_path}"   # Alt+D: split pane right
bind -n M-D split-window -v -c "#{pane_current_path}"   # Alt+Shift+D: split pane down
bind -n M-t new-window -c "#{pane_current_path}"         # Alt+T: new tab
# Alt+W twice: close pane (closes the tab if it's the last pane).
# The first press arms the "close-pane" key table for 2s; any other key disarms it and works as normal.
bind -n M-w switch-client -T close-pane \; display-message -d 2000 "Press Alt+W again to close this pane" \; run-shell -b "sleep 2; tmux switch-client -c '#{client_name}' -T root"
bind -T close-pane M-w kill-pane

# Alt+Arrow: move between panes; Left/Right at the edge jumps to the previous/next tab
bind -n M-Left  if -F "#{pane_at_left}"  "previous-window" "select-pane -L"
bind -n M-Right if -F "#{pane_at_right}" "next-window"     "select-pane -R"
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# Alt+1..9: select tab
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9

# --- Tab names follow the main Claude Code session in each tab ---
# The script reads ~/.claude/sessions and prints nothing; status-interval sets how often it runs.
set -g status-interval 5
set -g status-right "#(~/.config/tmux/claude-tab-names.sh)\"#{=21:pane_title}\" %H:%M %d-%b-%y"

# --- Mouse selection copies to the system clipboard ---
# copy-command is the OS clipboard tool; set-clipboard also sends OSC 52 for terminals that accept it
set -s copy-command "@CLIPBOARD@"
set -s set-clipboard on
bind -T copy-mode    MouseDragEnd1Pane send -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel

# --- Machine-specific ---
